<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{base :: layout(~{::section}, ~{::style}, false)}">
<head>
    <style>
        .verify-wrapper { padding: 1rem; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        .verify-card { width: 100%; max-width: 450px; background: var(--bg-card); padding: 2.5rem; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; animation: slideUp 0.4s ease-out; }
        
        .badge-authentic { display: inline-block; background: var(--success); color: #fff; font-size: 1.8rem; font-weight: 800; letter-spacing: 3px; padding: 12px 24px; border-radius: 8px; margin-bottom: 2rem; border: 2px solid #27ae60; text-shadow: 0 2px 4px rgba(0,0,0,0.3); box-shadow: 0 0 20px rgba(46, 204, 113, 0.4); }
        .badge-invalid { display: inline-block; background: var(--danger); color: #fff; font-size: 1.5rem; font-weight: 800; letter-spacing: 2px; padding: 12px 24px; border-radius: 8px; margin-bottom: 1rem; border: 2px solid #c0392b; box-shadow: 0 0 20px rgba(231, 76, 60, 0.4); }
        
        .data-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; text-align: left; }
        .data-row { background: var(--input-bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
        .data-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        .data-value { font-size: 1.2rem; color: var(--text-primary); font-weight: 700; word-break: break-word; }
        
        .spinner { border: 4px solid var(--border); border-top: 4px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1.5rem; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <section class="verify-wrapper">
        <img src="/img/credifyqr-draft-trans.png" alt="CredifyQR" style="height: 60px; margin-bottom: 2rem; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));">
        
        <div id="loading-state" class="verify-card" style="box-shadow: none; background: transparent; border: none;">
            <div class="spinner"></div>
            <p style="color: var(--text-secondary); font-weight: 500;">Verifying Cryptographic Signature...</p>
        </div>
        
        <div id="verify-success" class="verify-card hidden">
            <div class="badge-authentic">✓ AUTHENTIC</div>
            <div class="data-grid">
                <div class="data-row"><span class="data-label">Issued To</span><span class="data-value" id="v-name"></span></div>
                <div class="data-row"><span class="data-label">Document Type</span><span class="data-value" id="v-type"></span></div>
                <div class="data-row"><span class="data-label">Issuance Date</span><span class="data-value" id="v-date"></span></div>
                <div class="data-row"><span class="data-label">Cryptographic Status</span><span class="data-value" style="color: var(--success);" id="v-status"></span></div>
            </div>
            <p style="margin-top: 2rem; font-size: 0.8rem; color: var(--text-secondary);">Verify that the details above match the physical document presented to you.</p>
        </div>

        <div id="verify-error" class="verify-card hidden" style="border-color: var(--danger);">
            <div class="badge-invalid">✕ FORGED OR INVALID</div>
            <p style="color: var(--text-secondary); margin-top: 1rem; font-size: 0.95rem;" id="v-err-msg"></p>
            <p style="margin-top: 2rem; font-size: 0.8rem; color: var(--danger);">Do not accept this document. It fails cryptographic verification.</p>
        </div>
        
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', async () => {
                const docId = /*[[${docId}]]*/ '';
                
                if (!docId) {
                    showError("Malformed verification URL.");
                    return;
                }

                try {
                    const res = await fetch(`/api/public/verify/${docId}`);
                    const loading = document.getElementById('loading-state');
                    loading.classList.add('hidden');

                    if (res.ok) {
                        const data = await res.json();
                        document.getElementById('v-name').textContent = data.studentName;
                        document.getElementById('v-type').textContent = data.documentType;
                        document.getElementById('v-date').textContent = new Date(data.issueDate).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
                        document.getElementById('v-status').textContent = "VERIFIED " + data.status;
                        
                        document.getElementById('verify-success').classList.remove('hidden');
                    } else {
                        throw new Error(await res.text());
                    }
                } catch (e) {
                    showError(e.message || 'Verification rejected by server.');
                }
            });

            function showError(msg) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('verify-error').classList.remove('hidden');
                document.getElementById('v-err-msg').textContent = msg;
            }
        </script>
    </section>
</body>
</html>
