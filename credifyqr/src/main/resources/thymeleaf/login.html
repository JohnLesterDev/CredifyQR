<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CredifyQR - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>CredifyQR Identity</h2>
        <div id="login-panel">
            <h3>Login</h3>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password">
            </div>
            <button onclick="handleLogin()">Login</button>
            <p>Don't have an account? <a href="#" onclick="showRegister()">Register</a></p>
            <div id="login-error" class="error hidden"></div>
        </div>

        <div id="register-panel" class="hidden">
            <h3>Register</h3>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password">
            </div>
            <div class="form-group">
                <label>Role</label>
                <select id="reg-role">
                    <option value="STUDENT">Student</option>
                    <option value="REGISTRAR_STAFF">Registrar Staff</option>
                    <option value="CAMPUS_DIRECTOR">Campus Director</option>
                </select>
            </div>
            <button onclick="handleRegister()">Register</button>
            <p>Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
            <div id="register-error" class="error hidden"></div>
            <div id="register-success" class="success hidden"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>   <!-- we'll keep JS as static -->
    <script>
        // Same JavaScript logic as before
        function showRegister() {
            document.getElementById('login-panel').classList.add('hidden');
            document.getElementById('register-panel').classList.remove('hidden');
        }
        function showLogin() {
            document.getElementById('register-panel').classList.add('hidden');
            document.getElementById('login-panel').classList.remove('hidden');
        }

        async function handleLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                    credentials: 'same-origin'
                });
                if (resp.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = await resp.text();
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Login failed';
                errorEl.classList.remove('hidden');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;
            const errorEl = document.getElementById('register-error');
            const successEl = document.getElementById('register-success');
            errorEl.textContent = '';
            successEl.textContent = '';
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);
                formData.append('role', role);
                const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });
                if (resp.ok) {
                    successEl.textContent = await resp.text();
                    successEl.classList.remove('hidden');
                } else {
                    errorEl.textContent = await resp.text();
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Registration failed';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
