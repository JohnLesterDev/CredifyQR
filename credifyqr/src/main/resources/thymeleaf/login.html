<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{base :: layout(~{::section}, ~{::style}, false)}">
<head>
    <style>
        .pwd-wrapper { position: relative; display: flex; align-items: center; }
        .pwd-wrapper input { padding-right: 40px; width: 100%; }
        .eye-btn { position: absolute; right: 12px; width: 20px; height: 20px; color: var(--text-secondary); cursor: pointer; display: flex; -webkit-touch-callout: none; user-select: none; }
        .remember-me { display: flex; align-items: center; margin-bottom: 1.25rem; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; user-select: none; position: relative; }
        .remember-me input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { height: 18px; width: 18px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; margin-right: 10px; position: relative; transition: all 0.2s ease; }
        .remember-me:hover input ~ .checkmark { border-color: var(--accent); }
        .remember-me input:checked ~ .checkmark { background-color: var(--accent); border-color: var(--accent); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 5px; top: 1px; width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .remember-me input:checked ~ .checkmark:after { display: block; }
    </style>
</head>
<body>
    <section class="container auth-container">
        <div class="brand-header">
            <img src="/img/credifyqr-draft-trans.png" alt="Logo" class="brand-logo">
            <h2 id="panel-title">Student Portal</h2>
        </div>
        
        <form id="login-panel" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label>8-Digit Student ID</label>
                <input type="text" th:id="'u_' + ${nonce}" data-target="login-user" 
                       pattern="\d{8}" maxlength="8" inputmode="numeric" 
                       placeholder="e.g. 12345678" required
                       oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="pwd-wrapper">
                    <input type="password" th:id="'p_' + ${nonce}" data-target="login-pass" placeholder="Enter Password" required>
                    <div class="eye-btn" 
                         onmousedown="this.previousElementSibling.type='text'" 
                         onmouseup="this.previousElementSibling.type='password'"
                         onmouseleave="this.previousElementSibling.type='password'"
                         ontouchstart="event.preventDefault(); this.previousElementSibling.type='text';"
                         ontouchend="this.previousElementSibling.type='password'"
                         ontouchcancel="this.previousElementSibling.type='password'">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </div>
                </div>
            </div>
            <label class="remember-me">
                <input type="checkbox" id="remember-me">
                <span class="checkmark"></span>
                Remember Me
            </label>
            <button type="submit" style="width: 100%;">Access Portal</button>
            <p class="auth-toggle">New to the system? <a href="#" onclick="showClaim()">Claim Account</a></p>
            <p class="auth-toggle" style="margin-top: 0.5rem; font-size: 0.8rem;"><a href="/admin">Administrative Login</a></p>
            <div id="login-error" class="error hidden"></div>
        </form>

        <form id="claim-panel" class="hidden" onsubmit="event.preventDefault(); handleClaim();">
            <div class="form-group">
                <label>8-Digit Student ID</label>
                <input type="text" id="claim-id" placeholder="e.g. 12345678" pattern="\d{8}" maxlength="8" inputmode="numeric" required oninput="this.value = this.value.replace(/[^0-9]/g, '');">
            </div>
            <div class="form-group">
                <label>Personal Birthdate</label>
                <input type="date" id="claim-dob" required>
            </div>
            <button type="submit" style="width: 100%;">Verify & Generate Credential</button>
            <p class="auth-toggle">Ready to sign in? <a href="#" onclick="showLogin()">Back to Login</a></p>
            <div id="claim-error" class="error hidden"></div>

            <div id="temp-password-box" class="temp-credential-card hidden">
                <div class="credential-header">Identity Verified</div>
                <p class="credential-warning">Copy your temporary password now. You will be forced to change it on the next step.</p>
                <div class="credential-value" id="temp-pwd-text"></div>
                <button type="button" onclick="copyAndRedirect(event)" style="width: 100%;">Copy & Proceed</button>
            </div>
        </form>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const savedUser = localStorage.getItem('credify_student_id');
                if (savedUser) {
                    document.querySelector('input[data-target="login-user"]').value = savedUser;
                    document.getElementById('remember-me').checked = true;
                }
            });

            function showClaim() {
                document.getElementById('login-panel').classList.add('hidden');
                document.getElementById('claim-panel').classList.remove('hidden');
                document.getElementById('panel-title').textContent = 'Account Verification';
            }
            function showLogin() {
                document.getElementById('claim-panel').classList.add('hidden');
                document.getElementById('login-panel').classList.remove('hidden');
                document.getElementById('panel-title').textContent = 'Student Portal';
            }

            async function handleClaim() {
                const id = document.getElementById('claim-id').value;
                const dob = document.getElementById('claim-dob').value;
                const err = document.getElementById('claim-error');
                const box = document.getElementById('temp-password-box');
                
                err.classList.add('hidden');
                box.classList.add('hidden');

                const formData = new URLSearchParams();
                formData.append('studentId', id); 
                formData.append('birthdate', dob);

                try {
                    const resp = await fetch('/api/claim-account', { method: 'POST', body: formData });
                    const text = await resp.text();
                    if (resp.ok) {
                        document.getElementById('temp-pwd-text').textContent = text;
                        box.classList.remove('hidden');
                    } else {
                        err.textContent = text;
                        err.classList.remove('hidden');
                    }
                } catch(e) {
                    err.textContent = "Network error";
                    err.classList.remove('hidden');
                }
            }

            async function copyAndRedirect(event) {
                const pwd = document.getElementById('temp-pwd-text').textContent;
                const btn = event ? event.target : document.querySelector('#temp-password-box button');
                
                const originalText = btn.textContent;
                btn.textContent = 'Proceeding...';
                btn.style.backgroundColor = 'var(--success)';
                btn.disabled = true;

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(pwd);
                        btn.textContent = '✓ Copied!';
                    }
                } catch (e) {
                    console.warn("Clipboard access denied, ignoring.");
                }

                setTimeout(() => {
                    showLogin();
                    btn.textContent = originalText;
                    btn.style.backgroundColor = '';
                    btn.disabled = false;
                    document.querySelector('input[data-target="login-user"]').value = document.getElementById('claim-id').value;
                    document.querySelector('input[data-target="login-pass"]').value = pwd;
                    document.getElementById('temp-password-box').classList.add('hidden');
                    document.getElementById('claim-id').value = '';
                    document.getElementById('claim-dob').value = '';
                }, 1000);
            }

            async function handleLogin() {
                const user = document.querySelector('input[data-target="login-user"]').value;
                const pass = document.querySelector('input[data-target="login-pass"]').value;
                const rememberMe = document.getElementById('remember-me').checked;
                const err = document.getElementById('login-error');
                err.classList.add('hidden');

                if (rememberMe) {
                    localStorage.setItem('credify_student_id', user);
                } else {
                    localStorage.removeItem('credify_student_id');
                }

                const formData = new URLSearchParams();
                formData.append('username', user);
                formData.append('password', pass);
                formData.append('rememberMe', rememberMe);

                const resp = await fetch('/api/login', { method: 'POST', body: formData, credentials: 'same-origin' });
                if (resp.ok) { window.location.href = '/dashboard'; }
                else { err.textContent = await resp.text(); err.classList.remove('hidden'); }
            }
        </script>
    </section>
</body>
</html>
