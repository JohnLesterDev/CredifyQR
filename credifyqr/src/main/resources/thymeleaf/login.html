<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CredifyQR - Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>CredifyQR Identity</h2>
        
        <div id="login-panel">
            <h3>Login</h3>
            <div class="form-group">
                <label>Credential ID</label>
                <input type="text" th:id="'u_' + ${nonce}" th:name="'u_' + ${nonce}" data-target="login-user" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" th:id="'p_' + ${nonce}" th:name="'p_' + ${nonce}" data-target="login-pass" autocomplete="new-password">
            </div>
            <button onclick="handleLogin()">Login</button>
            <p>First time here? <a href="#" onclick="showClaim()">Claim Account</a></p>
            <div id="login-error" class="error hidden"></div>
        </div>

        <div id="claim-panel" class="hidden">
            <h3>Claim Student Account</h3>
            <div class="form-group">
                <label>8-Digit Student ID</label>
                <input type="text" id="claim-id" placeholder="e.g. 25001234" maxlength="8">
            </div>
            <div class="form-group">
                <label>Birthdate</label>
                <input type="date" id="claim-dob">
            </div>
            <button onclick="handleClaim()">Verify & Get Password</button>
            <p>Already claimed? <a href="#" onclick="showLogin()">Login</a></p>
            
            <div id="claim-error" class="error hidden"></div>

            <div id="temp-password-box" class="hidden" style="margin-top: 15px; padding: 15px; background: var(--input-bg); border: 1px dashed var(--accent); border-radius: 8px;">
                <span style="font-size: 0.9rem; color: var(--text-secondary);">Temporary Password:</span><br>
                <strong id="temp-pwd-text" style="font-size: 1.2rem; letter-spacing: 2px;"></strong>
                <button class="secondary" onclick="copyPassword()" style="margin-top: 10px; width: 100%;">📋 Copy Password</button>
                <p style="font-size: 0.8rem; color: var(--danger); margin-top: 10px;">Store this immediately. It will not be shown again.</p>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        function showClaim() {
            document.getElementById('login-panel').classList.add('hidden');
            document.getElementById('claim-panel').classList.remove('hidden');
        }

        function showLogin() {
            document.getElementById('claim-panel').classList.add('hidden');
            document.getElementById('login-panel').classList.remove('hidden');
        }

        async function handleClaim() {
            const studentId = document.getElementById('claim-id').value;
            const birthdate = document.getElementById('claim-dob').value;
            const errorEl = document.getElementById('claim-error');
            const pwdBox = document.getElementById('temp-password-box');
            const pwdText = document.getElementById('temp-pwd-text');
            
            errorEl.classList.add('hidden');
            pwdBox.classList.add('hidden');

            try {
                const formData = new URLSearchParams();
                formData.append('studentId', studentId);
                formData.append('birthdate', birthdate);

                const resp = await fetch('/api/claim-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                const text = await resp.text();
                if (resp.ok) {
                    pwdText.textContent = text;
                    pwdBox.classList.remove('hidden');
                } else {
                    errorEl.textContent = text;
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Network error. Try again.';
                errorEl.classList.remove('hidden');
            }
        }

        function copyPassword() {
            const pwd = document.getElementById('temp-pwd-text').textContent;
            navigator.clipboard.writeText(pwd).then(() => {
                alert('Password copied to clipboard. Proceed to login.');
                showLogin();
            });
        }

        async function handleLogin() {
            const username = document.querySelector('input[data-target="login-user"]').value;
            const password = document.querySelector('input[data-target="login-pass"]').value;
            const errorEl = document.getElementById('login-error');
            
            errorEl.textContent = '';
            errorEl.classList.add('hidden');
            
            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);
                
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                    credentials: 'same-origin'
                });
                
                if (resp.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = await resp.text();
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Login failed';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
