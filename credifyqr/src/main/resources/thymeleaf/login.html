<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{base :: layout(~{::section}, ~{::style})}">
<head>
    <style>
        .pwd-wrapper { position: relative; display: flex; align-items: center; }
        .pwd-wrapper input { padding-right: 40px; width: 100%; }
        .eye-btn { position: absolute; right: 12px; width: 20px; height: 20px; color: var(--text-secondary); cursor: pointer; user-select: none; display: flex; }
        .eye-btn:hover { color: var(--text-primary); }
        .eye-btn svg { width: 100%; height: 100%; }
        
        .remember-me { display: flex; align-items: center; margin-bottom: 1.25rem; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; user-select: none; position: relative; }
        .remember-me input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { height: 18px; width: 18px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; margin-right: 10px; position: relative; transition: all 0.2s ease; }
        .remember-me:hover input ~ .checkmark { border-color: var(--accent); }
        .remember-me input:checked ~ .checkmark { background-color: var(--accent); border-color: var(--accent); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 5px; top: 1px; width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .remember-me input:checked ~ .checkmark:after { display: block; }
    </style>
</head>
<body>
    <section class="container auth-container">
        <div class="brand-header">
            <img src="/img/credifyqr-draft-trans.png" alt="CredifyQR Logo" class="brand-logo">
            <h2 id="panel-title">CredifyQR - Login</h2>
        </div>
        
        <form id="login-panel" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label>Credential ID</label>
                <input type="text" th:id="'u_' + ${nonce}" th:name="'u_' + ${nonce}" data-target="login-user" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="pwd-wrapper">
                    <input type="password" th:id="'p_' + ${nonce}" th:name="'p_' + ${nonce}" data-target="login-pass" autocomplete="new-password">
                    <div class="eye-btn" 
                         onmousedown="revealPwd(this)" onmouseup="hidePwd(this)" onmouseleave="hidePwd(this)" 
                         ontouchstart="revealPwd(this, event)" ontouchend="hidePwd(this)" ontouchcancel="hidePwd(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </div>
                </div>
            </div>
            <label class="remember-me">
                <input type="checkbox" id="remember-me" name="rememberMe">
                <span class="checkmark"></span>
                Remember Me
            </label>
            <button type="submit" style="width: 100%;">Login</button>
            <p class="auth-toggle">First time here? <a href="#" onclick="showClaim()">Claim Student Account</a></p>
            <div id="login-error" class="error hidden"></div>
        </form>

        <form id="claim-panel" class="hidden" onsubmit="event.preventDefault(); handleClaim();">
            <div class="form-group">
                <label>8-Digit Student ID</label>
                <input type="text" id="claim-id" placeholder="e.g. 25001234" maxlength="8">
            </div>
            <div class="form-group">
                <label>Birthdate</label>
                <input type="date" id="claim-dob">
            </div>
            <button type="submit" style="width: 100%;">Verify & Get Password</button>
            <p class="auth-toggle">Already claimed? <a href="#" onclick="showLogin()">Login</a></p>
            
            <div id="claim-error" class="error hidden"></div>

            <div id="temp-password-box" class="temp-credential-card hidden">
                <div class="credential-header">Account Verified</div>
                <p class="credential-warning">Store this password immediately. It will not be shown again.</p>
                <div class="credential-value" id="temp-pwd-text"></div>
                <button type="button" id="copy-btn" onclick="copyPassword()" style="width: 100%;">Copy & Proceed to Login</button>
            </div>
        </form>

        <script>
            const svgEyeClosed = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            const svgEyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

            function revealPwd(btn, e) {
                if (e) e.preventDefault();
                btn.previousElementSibling.type = 'text';
                btn.innerHTML = svgEyeOpen;
            }

            function hidePwd(btn) {
                btn.previousElementSibling.type = 'password';
                btn.innerHTML = svgEyeClosed;
            }

            function showClaim() {
                document.getElementById('login-panel').classList.add('hidden');
                document.getElementById('claim-panel').classList.remove('hidden');
                document.getElementById('panel-title').textContent = 'Claim Student Account';
            }

            function showLogin() {
                document.getElementById('claim-panel').classList.add('hidden');
                document.getElementById('login-panel').classList.remove('hidden');
                document.getElementById('panel-title').textContent = 'CredifyQR - Login';
            }

            async function handleClaim() {
                const studentId = document.getElementById('claim-id').value;
                const birthdate = document.getElementById('claim-dob').value;
                const errorEl = document.getElementById('claim-error');
                const pwdBox = document.getElementById('temp-password-box');
                const pwdText = document.getElementById('temp-pwd-text');
                
                errorEl.classList.add('hidden');
                pwdBox.classList.add('hidden');

                try {
                    const formData = new URLSearchParams();
                    formData.append('studentId', studentId);
                    formData.append('birthdate', birthdate);

                    const resp = await fetch('/api/claim-account', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });

                    const text = await resp.text();
                    if (resp.ok) {
                        pwdText.textContent = text;
                        pwdBox.classList.remove('hidden');
                    } else {
                        errorEl.textContent = text;
                        errorEl.classList.remove('hidden');
                    }
                } catch (e) {
                    errorEl.textContent = 'Network error. Try again.';
                    errorEl.classList.remove('hidden');
                }
            }

            function copyPassword() {
                const pwd = document.getElementById('temp-pwd-text').textContent;
                const studentId = document.getElementById('claim-id').value;
                const btn = document.getElementById('copy-btn');
                
                navigator.clipboard.writeText(pwd).then(() => {
                    const originalText = btn.textContent;
                    btn.textContent = '✓ Copied! Redirecting...';
                    btn.style.backgroundColor = 'var(--success)';
                    btn.disabled = true;

                    document.querySelector('input[data-target="login-user"]').value = studentId;
                    document.querySelector('input[data-target="login-pass"]').value = pwd;

                    setTimeout(() => {
                        showLogin();
                        btn.textContent = originalText;
                        btn.style.backgroundColor = '';
                        btn.disabled = false;
                        document.getElementById('temp-password-box').classList.add('hidden');
                        document.getElementById('claim-id').value = '';
                        document.getElementById('claim-dob').value = '';
                    }, 1500);
                }).catch(err => {
                    console.error("Clipboard API failed: ", err);
                    alert("Failed to copy. Please manually copy the password.");
                });
            }

            async function handleLogin() {
                const username = document.querySelector('input[data-target="login-user"]').value;
                const password = document.querySelector('input[data-target="login-pass"]').value;
                const rememberMe = document.getElementById('remember-me').checked;
                const errorEl = document.getElementById('login-error');
                
                errorEl.textContent = '';
                errorEl.classList.add('hidden');
                
                try {
                    const formData = new URLSearchParams();
                    formData.append('username', username);
                    formData.append('password', password);
                    formData.append('rememberMe', rememberMe);
                    
                    const resp = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData,
                        credentials: 'same-origin'
                    });
                    
                    if (resp.ok) {
                        window.location.href = '/dashboard';
                    } else {
                        errorEl.textContent = await resp.text();
                        errorEl.classList.remove('hidden');
                    }
                } catch (e) {
                    errorEl.textContent = 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            }
        </script>
    </section>
</body>
</html>
