<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{base :: layout(~{::section}, ~{::style}, false)}">
<head>
    <style>
        .pwd-wrapper { position: relative; display: flex; align-items: center; }
        .pwd-wrapper input { padding-right: 40px; width: 100%; }
        .eye-btn { position: absolute; right: 12px; width: 20px; height: 20px; color: var(--text-secondary); cursor: pointer; user-select: none; display: flex;}
        .eye-btn:hover { color: var(--text-primary); }
        .eye-btn svg { width: 100%; height: 100%; }

        .strength-track { height: 6px; background: rgba(255, 255, 255, 0.05); border-radius: 3px; margin-top: 12px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; background: var(--danger); transition: all 0.3s ease; }
        .checklist { list-style: none; margin-top: 12px; padding: 0; font-size: 0.85rem; color: var(--text-secondary); }
        .checklist li { margin-bottom: 6px; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; background: var(--border) !important; color: var(--text-secondary) !important; }
    </style>
</head>
<body>
    <section class="container">
        <h2>Action Required</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
            You are using a temporary password. You must set a new password before accessing your account.
        </p>

        <form onsubmit="event.preventDefault(); submitNewPassword();">
            <div class="form-group">
                <label>New Password</label>
                <div class="pwd-wrapper">
                    <input type="password" id="new-password">
                    <div class="eye-btn" 
                         onmousedown="revealPwd(this)" onmouseup="hidePwd(this)" onmouseleave="hidePwd(this)" 
                         ontouchstart="revealPwd(this, event)" ontouchend="hidePwd(this)" ontouchcancel="hidePwd(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </div>
                </div>
                
                <div class="strength-track">
                    <div id="strength-bar" class="strength-bar"></div>
                </div>
                
                <ul class="checklist">
                    <li id="rule-length"><span>✕</span> Minimum 12 characters</li>
                    <li id="rule-entropy"><span>✕</span> Contains letters & numbers</li>
                </ul>
            </div>
            
            <button type="submit" id="submit-btn" style="width: 100%;" disabled>Update Password</button>
            <div id="change-error" class="error hidden"></div>
        </form>

        <script>
            const svgEyeClosed = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            const svgEyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

            function revealPwd(btn, e) {
                if (e) e.preventDefault();
                btn.previousElementSibling.type = 'text';
                btn.innerHTML = svgEyeOpen;
            }

            function hidePwd(btn) {
                btn.previousElementSibling.type = 'password';
                btn.innerHTML = svgEyeClosed;
            }

            // Real-time Validation Logic
            const pwdInput = document.getElementById('new-password');
            const submitBtn = document.getElementById('submit-btn');
            const strengthBar = document.getElementById('strength-bar');
            const ruleLength = document.getElementById('rule-length');
            const ruleEntropy = document.getElementById('rule-entropy');

            pwdInput.addEventListener('input', (e) => {
                const val = e.target.value;
                let strength = 0;
                
                const passedLength = val.length >= 12;
                const passedEntropy = /[a-zA-Z]/.test(val) && /[0-9]/.test(val);

                ruleLength.innerHTML = passedLength ? '<span>✓</span> Minimum 12 characters' : '<span>✕</span> Minimum 12 characters';
                ruleLength.style.color = passedLength ? 'var(--success)' : 'var(--text-secondary)';
                
                ruleEntropy.innerHTML = passedEntropy ? '<span>✓</span> Contains letters & numbers' : '<span>✕</span> Contains letters & numbers';
                ruleEntropy.style.color = passedEntropy ? 'var(--success)' : 'var(--text-secondary)';

                if (val.length > 0) strength += 25;
                if (val.length >= 8) strength += 25;
                if (passedLength) strength += 25;
                if (passedEntropy) strength += 25;

                strengthBar.style.width = strength + '%';
                
                if (strength <= 50) {
                    strengthBar.style.background = 'var(--danger)';
                } else if (strength === 75) {
                    strengthBar.style.background = '#f39c12';
                } else {
                    strengthBar.style.background = 'var(--success)';
                }

                if (passedLength && passedEntropy && strength === 100) {
                    submitBtn.disabled = false;
                } else {
                    submitBtn.disabled = true;
                }
            });

            async function submitNewPassword() {
                const newPassword = pwdInput.value;
                const errorEl = document.getElementById('change-error');
                
                errorEl.classList.add('hidden');

                if (submitBtn.disabled) return;

                try {
                    const formData = new URLSearchParams();
                    formData.append('newPassword', newPassword);

                    const resp = await fetch('/api/change-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData,
                        credentials: 'same-origin'
                    });

                    if (resp.ok) {
                        window.location.href = '/dashboard';
                    } else {
                        errorEl.textContent = await resp.text();
                        errorEl.classList.remove('hidden');
                    }
                } catch (e) {
                    errorEl.textContent = 'Network error. Try again.';
                    errorEl.classList.remove('hidden');
                }
            }
        </script>
    </section>
</body>
</html>
