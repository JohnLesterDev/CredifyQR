<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CredifyQR - Change Password</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <h2>Action Required</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
            You are using a temporary password. You must set a new password before accessing your account.
        </p>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="new-password">
        </div>
        
        <button onclick="submitNewPassword()" style="width: 100%;">Update Password</button>
        <div id="change-error" class="error hidden"></div>
    </div>

    <script>
        async function submitNewPassword() {
            const newPassword = document.getElementById('new-password').value;
            const errorEl = document.getElementById('change-error');
            
            errorEl.classList.add('hidden');

            if (!newPassword) {
                errorEl.textContent = 'Password cannot be empty.';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const formData = new URLSearchParams();
                formData.append('newPassword', newPassword);

                const resp = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                    credentials: 'same-origin'
                });

                if (resp.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = await resp.text();
                    errorEl.classList.remove('hidden');
                }
            } catch (e) {
                errorEl.textContent = 'Network error. Try again.';
                errorEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
