<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{base :: layout(~{::section}, ~{::style}, true)}">
<head>
    <style>
        :root {
            --accent: #f39c12;
            --accent-hover: #e67e22;
        }
        .pwd-wrapper { position: relative; display: flex; align-items: center; }
        .pwd-wrapper input { padding-right: 40px; width: 100%; }
        .eye-btn { position: absolute; right: 12px; width: 20px; height: 20px; color: var(--text-secondary); cursor: pointer; user-select: none; display: flex; }
        .eye-btn:hover { color: var(--text-primary); }
        .eye-btn svg { width: 100%; height: 100%; }
        
        .remember-me { display: flex; align-items: center; margin-bottom: 1.25rem; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; user-select: none; position: relative; }
        .remember-me input { position: absolute; opacity: 0; cursor: pointer; height: 0; width: 0; }
        .checkmark { height: 18px; width: 18px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 4px; margin-right: 10px; position: relative; transition: all 0.2s ease; }
        .remember-me:hover input ~ .checkmark { border-color: var(--accent); }
        .remember-me input:checked ~ .checkmark { background-color: var(--accent); border-color: var(--accent); }
        .checkmark:after { content: ""; position: absolute; display: none; left: 5px; top: 1px; width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }
        .remember-me input:checked ~ .checkmark:after { display: block; }
        
        .brand-header h2 { color: var(--accent); } 
    </style>
</head>
<body>
    <section class="container auth-container">
        <div class="brand-header">
            <img src="/img/credifyqr-logo-admin.png" alt="CredifyQR Logo" class="brand-logo">
            <h2 id="panel-title">System Administration</h2>
        </div>
        
        <form id="login-panel" onsubmit="event.preventDefault(); handleLogin();">
            <div class="form-group">
                <label>Staff Username</label>
                <input type="text" th:id="'u_' + ${nonce}" data-target="login-user" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label>Passphrase</label>
                <div class="pwd-wrapper">
                    <input type="password" th:id="'p_' + ${nonce}" data-target="login-pass" autocomplete="new-password" required>
                    <div class="eye-btn" onmousedown="revealPwd(this)" onmouseup="hidePwd(this)" onmouseleave="hidePwd(this)">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </div>
                </div>
            </div>
            <label class="remember-me">
                <input type="checkbox" id="remember-me">
                <span class="checkmark"></span>
                Remember Me
            </label>
            <button type="submit" style="width: 100%;">Secure Login</button>
            <p class="auth-toggle">First time Staff? <a href="#" id="claim-link" onclick="showClaim()">Claim Identity</a></p>            
            <p class="auth-toggle" style="margin-top: 0.5rem; font-size: 0.8rem;">
                <a href="/login">&larr; Return to Student Portal</a>
            </p>
            <div id="login-error" class="error hidden"></div>
        </form>

        <form id="claim-panel" class="hidden" onsubmit="event.preventDefault(); handleClaim();">
            
            <div style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1rem;">
                <div class="form-group">
                    <label>Assigned Staff Username</label>
                    <input type="text" id="claim-id" placeholder="e.g. 76403448" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Verification Birthdate</label>
                    <input type="date" id="claim-dob" required>
                </div>
            </div>

            <div class="form-group">
                <label>Set Work / Recovery Email</label>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="text" id="claim-email-prefix" placeholder="e.g. jdoe" required pattern="[a-zA-Z0-9._\-]+" title="Only letters, numbers, dots, dashes, and underscores allowed." style="flex: 1;">
                    <span id="domain-suffix" style="color: var(--text-secondary); font-weight: 500; font-family: monospace;">@loading...</span>
                </div>
                <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 5px;">This email will be permanently linked to your account.</p>
            </div>

            <button type="submit" style="width: 100%; margin-top: 1rem;">Verify & Extract Password</button>
            <p class="auth-toggle">Identity claimed? <a href="#" onclick="showLogin()">Secure Login</a></p>
            <div id="claim-error" class="error hidden"></div>

            <div id="temp-password-box" class="temp-credential-card hidden" style="margin-top: 1.5rem;">
                <div class="credential-header">Identity Verified</div>
                <p class="credential-warning">Store this password immediately. It will not be shown again.</p>
                <div class="credential-value" id="temp-pwd-text"></div>
                <button type="button" onclick="copyAndRedirect()" style="width: 100%;">Copy & Proceed to Login</button>
            </div>
        </form>

        <script>
            const svgEyeClosed = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            const svgEyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';

            let globalDomain = "";

            document.addEventListener('DOMContentLoaded', async () => {
                const savedUser = localStorage.getItem('credify_staff_id');
                if (savedUser) {
                    document.querySelector('input[data-target="login-user"]').value = savedUser;
                    document.getElementById('remember-me').checked = true;
                }

                // Fetch institutional domain on load via PUBLIC route
                try {
                    const res = await fetch('/api/public/domain');
                    if (res.ok) {
                        const data = await res.json();
                        globalDomain = data.domain;
                        
                        if (globalDomain) {
                            document.getElementById('domain-suffix').textContent = '@' + globalDomain;
                        } else {
                            lockSystem("DOMAIN NOT CONFIGURED");
                        }
                    } else {
                        lockSystem("API REJECTED");
                    }
                } catch(e) {
                    lockSystem("NETWORK ERROR");
                }
            });

            // Aggressive UI Lockdown
            function lockSystem(reason) {
                document.getElementById('domain-suffix').textContent = '@[LOCKED]';
                
                const claimLink = document.getElementById('claim-link');
                if (claimLink) {
                    claimLink.style.opacity = '0.4';
                    claimLink.style.pointerEvents = 'none';
                    claimLink.style.cursor = 'not-allowed';
                    claimLink.style.textDecoration = 'none';
                    claimLink.title = `Disabled: ${reason}`;
                }
            }

            function revealPwd(btn, e) {
                if (e) e.preventDefault();
                btn.previousElementSibling.type = 'text';
                btn.innerHTML = svgEyeOpen;
            }

            function hidePwd(btn) {
                btn.previousElementSibling.type = 'password';
                btn.innerHTML = svgEyeClosed;
            }

            function showClaim() {
                document.getElementById('login-panel').classList.add('hidden');
                document.getElementById('claim-panel').classList.remove('hidden');
                document.getElementById('panel-title').textContent = 'Claim Identity';
            }

            function showLogin() {
                document.getElementById('claim-panel').classList.add('hidden');
                document.getElementById('login-panel').classList.remove('hidden');
                document.getElementById('panel-title').textContent = 'System Administration';
            }

            async function handleClaim() {
                const id = document.getElementById('claim-id').value;
                const dob = document.getElementById('claim-dob').value;
                const prefix = document.getElementById('claim-email-prefix').value;
                
                const err = document.getElementById('claim-error');
                const box = document.getElementById('temp-password-box');
                const pwdText = document.getElementById('temp-pwd-text');
                
                err.classList.add('hidden');
                box.classList.add('hidden');

                if (!globalDomain) {
                    err.textContent = 'Institution domain is not configured. Contact SysAdmin.';
                    err.classList.remove('hidden');
                    return;
                }
                if (!/^[a-zA-Z0-9._\-]+$/.test(prefix)) {
                    err.textContent = 'Invalid email prefix. Use only letters, numbers, dots, dashes, and underscores.';
                    err.classList.remove('hidden');
                    return;
                }

                const fullEmail = prefix + '@' + globalDomain;

                try {
                    const formData = new URLSearchParams();
                    formData.append('employeeId', id); 
                    formData.append('birthdate', dob);
                    formData.append('email', fullEmail); 

                    const resp = await fetch('/api/staff/claim-account', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData
                    });

                    const text = await resp.text();
                    if (resp.ok) {
                        pwdText.textContent = text;
                        box.classList.remove('hidden');
                    } else {
                        err.textContent = text;
                        err.classList.remove('hidden');
                    }
                } catch (e) {
                    err.textContent = 'Network error. Try again.';
                    err.classList.remove('hidden');
                }
            }

            function copyAndRedirect() {
                const pwd = document.getElementById('temp-pwd-text').textContent;
                const prefix = document.getElementById('claim-email-prefix').value;
                const fullEmail = prefix + '@' + globalDomain;
                const btn = event.target;
                
                navigator.clipboard.writeText(pwd).then(() => {
                    const originalText = btn.textContent;
                    btn.textContent = '✓ Copied! Redirecting...';
                    btn.style.backgroundColor = 'var(--success)';
                    btn.disabled = true;

                    document.querySelector('input[data-target="login-user"]').value = fullEmail;
                    document.querySelector('input[data-target="login-pass"]').value = pwd;

                    setTimeout(() => {
                        showLogin();
                        btn.textContent = originalText;
                        btn.style.backgroundColor = '';
                        btn.disabled = false;
                        document.getElementById('temp-password-box').classList.add('hidden');
                        document.getElementById('claim-id').value = '';
                        document.getElementById('claim-email-prefix').value = '';
                        document.getElementById('claim-dob').value = '';
                    }, 1500);
                }).catch(() => alert("Failed to copy. Please copy manually."));
            }

            async function handleLogin() {
                const username = document.querySelector('input[data-target="login-user"]').value;
                const password = document.querySelector('input[data-target="login-pass"]').value;
                const rememberMe = document.getElementById('remember-me').checked;
                const errorEl = document.getElementById('login-error');

                if (rememberMe) {
                    localStorage.setItem('credify_staff_id', username);
                } else {
                    localStorage.removeItem('credify_staff_id');
                }
                
                errorEl.textContent = '';
                errorEl.classList.add('hidden');
                
                try {
                    const formData = new URLSearchParams();
                    formData.append('username', username);
                    formData.append('password', password);
                    formData.append('rememberMe', rememberMe);
                    
                    const resp = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formData,
                        credentials: 'same-origin'
                    });
                    
                    if (resp.ok) {
                        window.location.href = '/dashboard';
                    } else {
                        errorEl.textContent = await resp.text();
                        errorEl.classList.remove('hidden');
                    }
                } catch (e) {
                    errorEl.textContent = 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            }
        </script>
    </section>
</body>
</html>
