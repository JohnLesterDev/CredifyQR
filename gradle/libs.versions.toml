[versions]
guava = "32.1.2-jre"
javalin = "6.4.0"
logback = "1.5.3"
thymeleaf = "3.1.2.RELEASE"
sqlite = "3.45.2.0"
jjwt = "0.12.5"
jbcrypt = "0.4"
dotenv = "3.0.0"
owasp-sanitizer = "20260313.1"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
javalin-bundle = { group = "io.javalin", name = "javalin-bundle", version.ref = "javalin" }
javalin-rendering = { group = "io.javalin", name = "javalin-rendering", version.ref = "javalin" }
thymeleaf = { group = "org.thymeleaf", name = "thymeleaf", version.ref = "thymeleaf" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }
logback-classic = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
dotenv-java = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv" }
owasp-java-html-sanitizer = { module = "com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer", version.ref = "owasp-sanitizer" }