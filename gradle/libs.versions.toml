[versions]
guava = "32.1.2-jre"
javalin = "6.4.0"
mysql = "9.2.0"
slf4j = "2.0.12"
thymeleaf = "3.1.2.RELEASE"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
javalin-bundle = { group = "io.javalin", name = "javalin-bundle", version.ref = "javalin" }
javalin-rendering = { group = "io.javalin", name = "javalin-rendering", version.ref = "javalin" }
thymeleaf = { group = "org.thymeleaf", name = "thymeleaf", version.ref = "thymeleaf" }
mysql-connector = { group = "com.mysql", name = "mysql-connector-j", version.ref = "mysql" }
slf4j-simple = { group = "org.slf4j", name = "slf4j-simple", version.ref = "slf4j" }